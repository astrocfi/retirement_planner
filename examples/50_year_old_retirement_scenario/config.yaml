# Events Section
events:
  income: []
  expenses:
    - name: "retirement_expenses"
      event_type: "expense"
      period:
        start_age: 67
        end_age: 95
        description: "Retirement living expenses"
      amount: 80000.0
      probability: 1.0
      description: "Annual retirement expenses (today's dollars)"
  assets: []
  liabilities: []
  benefits: []

# Simulation Section
simulation:
  num_scenarios: 10000
  time_horizon: 45  # Years to simulate (50 to 95 = 45 years)
  time_step: 1
  random_seed: 42
  random_generation:
    method: "sobol"
    antithetic_variates: true
    latin_hypercube: false
  market_scenarios:
    return_distribution: "normal"
    fat_tails: true
    regime_switching: true
    regimes:
      normal:
        probability: 0.70
        duration_mean: 5.0
      recession:
        probability: 0.20
        duration_mean: 2.0
      boom:
        probability: 0.10
        duration_mean: 3.0
  correlations:
    stock_bond_correlation: -0.1
    stock_cash_correlation: 0.0
    bond_cash_correlation: 0.1
    inflation_return_correlation: -0.2
    inflation_bond_correlation: -0.3
  portfolio:
    rebalancing:
      frequency: "annual"
      threshold: 0.05
      costs: 0.001
    withdrawal_strategy: "constant_real"
    withdrawal_rate: 0.04
    glide_path:
      enabled: true
      start_allocation:
        stocks: 0.60
        bonds: 0.40
      end_allocation:
        stocks: 0.30
        bonds: 0.70
      transition_age: 85
  risk_management:
    stop_loss:
      enabled: true
      threshold: -0.20
      action: "reduce_withdrawals"
    dynamic_withdrawals:
      enabled: true
      adjustment_factor: 0.1
      lookback_period: 3
  success_criteria:
    portfolio_success:
      min_ending_value: 0.0
      probability_threshold: 0.80
    income_success:
      min_income_ratio: 0.8
      probability_threshold: 0.90
  output:
    generate_summary: true
    generate_detailed_scenarios: false
    generate_charts: true
    generate_reports: true
    charts:
      - "monte_carlo_paths"
      - "success_probability"
      - "withdrawal_sustainability"
      - "asset_allocation_evolution"
      - "cash_flow_projection"
      - "risk_metrics"
    report_format: "pdf"
    include_appendix: true
    output_prefix: "retirement_analysis"
    timestamp_output: true
  performance:
    parallel_processing: true
    num_processes: 4
    memory_limit: "4GB"
    cache_results: true

# Economy Section
economy:
  inflation:
    expected_rate: 0.025
    volatility: 0.01
    model: "random_walk"
    mean_reversion_speed: 0.1
    long_term_mean: 0.025
  risk_free_rate:
    rate: 0.025
    start_date: "2024-01-01"
    end_date: "2050-12-31"
    frequency: "monthly"
    source: "Treasury"
  data_sources:
    stocks: "SPY"
    bonds: "AGG"
    risk_free: "GS3M"
  market_regimes:
    normal:
      probability: 0.70
      stock_return: 0.07
      bond_return: 0.045
      stock_vol: 0.12
      bond_vol: 0.05
    recession:
      probability: 0.20
      stock_return: -0.10
      bond_return: 0.08
      stock_vol: 0.20
      bond_vol: 0.08
    boom:
      probability: 0.10
      stock_return: 0.20
      bond_return: 0.01
      stock_vol: 0.15
      bond_vol: 0.06