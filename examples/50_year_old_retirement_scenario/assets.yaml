# Asset Configuration Example
# Demonstrates the new asset class structure with metadata-based configuration

assets:
  # Equity Assets
  equities:
    - name: "S&P 500 ETF"
      asset_type: "equity"
      current_value: 600000.0
      expected_return: 0.07
      volatility: 0.18
      correlation: {}
      description: "Large cap domestic equity exposure"
      metadata:
        dividend_yield: 0.015
        beta: 1.0
        market_cap: "large"
        geography: "domestic"
        is_public: true
        sector: "Broad Market"

    - name: "International Developed Markets ETF"
      asset_type: "equity"
      current_value: 150000.0
      expected_return: 0.06
      volatility: 0.20
      correlation: {}
      description: "International developed markets exposure"
      metadata:
        dividend_yield: 0.025
        beta: 0.9
        market_cap: "large"
        geography: "international"
        is_public: true
        region: "Developed Markets"
        foreign_tax_rate: 0.15

    - name: "Small Cap Value ETF"
      asset_type: "equity"
      current_value: 100000.0
      expected_return: 0.09
      volatility: 0.25
      correlation: {}
      description: "Small cap value exposure"
      metadata:
        dividend_yield: 0.02
        beta: 1.2
        market_cap: "small"
        geography: "domestic"
        is_public: true
        sector: "Value"

  # Bond Assets
  bonds:
    - name: "Total Bond Market ETF"
      asset_type: "bond"
      current_value: 300000.0
      expected_return: 0.03
      volatility: 0.08
      correlation: {}
