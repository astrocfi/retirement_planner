      metadata:
        coupon_rate: 0.025
        face_value: 1000.0
        tax_treatment: "taxable"
        issuer_type: "government"
        credit_rating: "AAA"
        duration: 6.5

    - name: "Municipal Bond Fund"
      asset_type: "bond"
      current_value: 50000.0
      expected_return: 0.025
      volatility: 0.06
      correlation: {}
      description: "Tax-exempt municipal bonds"
      metadata:
        coupon_rate: 0.025
        face_value: 1000.0
        tax_treatment: "tax-exempt"
        issuer_type: "municipal"
        credit_rating: "AA"
        duration: 8.0

  # Cash Assets
  cash:
    - name: "High Yield Savings Account"
      asset_type: "cash"
      current_value: 50000.0
      expected_return: 0.035
      volatility: 0.01
      correlation: {}
      description: "Liquid cash reserves"
      metadata:
        interest_rate: 0.035
        fdic_insured: true
        minimum_balance: 1000.0
        monthly_fee: 0.0
        liquidity_score: 1.0
        account_type: "savings"
        compounding_frequency: 12

    - name: "Money Market Account"
      asset_type: "cash"
      current_value: 25000.0
      expected_return: 0.04
      volatility: 0.008
      correlation: {}
      description: "Money market for short-term needs"
      metadata:
        interest_rate: 0.04
        fdic_insured: true
        minimum_balance: 2500.0
        monthly_fee: 12.0
        liquidity_score: 0.9
        account_type: "money_market"
        check_writing_limit: 3

  # Alternative Assets
  alternatives:
    - name: "Real Estate Investment Trust"
      asset_type: "real_estate"
      current_value: 75000.0
      expected_return: 0.07
      volatility: 0.18
      correlation: {}
      description: "REIT exposure for diversification"
      metadata:
        property_type: "REIT"
        rental_yield: 0.04
        appreciation_rate: 0.03
        property_tax_rate: 0.012
