# Events Configuration
events:
  events:
    income:
      - name: "employment_income"
        event_type: "income"
        period:
          start_age: 50
          end_age: 67
          description: "Employment income period"
        amount: 80000.0
        probability: 1.0
        description: "Current employment income until retirement (today's dollars)"

      - name: "social_security_benefits"
        event_type: "benefit"
        period:
          start_age: 67
          end_age: 95
          description: "Social Security benefits period"
        amount: 25000.0
        probability: 1.0
        description: "Social Security benefits starting at full retirement age (today's dollars)"

    expenses:
      - name: "working_living_expenses"
        event_type: "expense"
        period:
          start_age: 50
          end_age: 66
          description: "Living expenses during working years"
        amount: 70000.0
        probability: 1.0
        description: "Annual living expenses during working years (today's dollars)"

      - name: "early_retirement_expenses"
        event_type: "expense"
        period:
          start_age: 67
          end_age: 84
          description: "Living expenses during early retirement"
        amount: 180000.0
        probability: 1.0
        description: "Annual living expenses during early retirement (today's dollars)"

      - name: "late_retirement_expenses"
        event_type: "expense"
        period:
          start_age: 85
          end_age: 95
          description: "Reduced living expenses during late retirement"
        amount: 160000.0
        probability: 1.0
        description: "Reduced annual living expenses during late retirement (today's dollars)"

    assets:
      - name: "initial_portfolio"
        event_type: "asset"
        period:
          start_age: 50
          end_age: 95
          description: "Initial portfolio value"
        amount: 1000000.0
        probability: 1.0
        description: "Initial portfolio value of $1M (today's dollars)"

      - name: "annual_401k_contribution"
        event_type: "asset"
        period:
          start_age: 50
          end_age: 66
          description: "Annual 401(k) contributions"
        amount: 10000.0
        probability: 1.0
        description: "Annual 401(k) contributions until retirement (today's dollars)"

# Simulation Configuration
simulation:
  num_scenarios: 10000
  time_horizon: 45
  time_step: 1
  random_seed: 42

  # Random Number Generation
  random_generation:
    method: "sobol"
    antithetic_variates: true
    latin_hypercube: false

  # Market Scenario Generation
  market_scenarios:
    return_distribution: "normal"
    fat_tails: true
    regime_switching: true
    regimes:
      normal:
        probability: 0.70
        duration_mean: 5.0
      recession:
        probability: 0.20
        duration_mean: 2.0
      boom:
        probability: 0.10
        duration_mean: 3.0

  # Portfolio Management
  portfolio:
    rebalancing:
      frequency: "annual"
      threshold: 0.05
      costs: 0.001

    withdrawal_strategy: "constant_real"
    withdrawal_rate: 0.04

    glide_path:
      enabled: true
      start_allocation:
        stocks: 0.60
        bonds: 0.40
      end_allocation:
        stocks: 0.30
        bonds: 0.70
      transition_age: 85

  # Risk Management
  risk_management:
    stop_loss:
      enabled: true
      threshold: -0.20
      action: "reduce_withdrawals"

    dynamic_withdrawals:
      enabled: true
      adjustment_factor: 0.1
      lookback_period: 3

  # Success Criteria
  success_criteria:
    portfolio_success:
      min_ending_value: 0.0
      probability_threshold: 0.80

    income_success:
      min_income_ratio: 0.8
      probability_threshold: 0.90

  # Output Configuration
  output:
    generate_summary: true
    generate_detailed_scenarios: false
    generate_charts: true
    generate_reports: true

    charts:
      - "monte_carlo_paths"
      - "success_probability"
      - "withdrawal_sustainability"
      - "asset_allocation_evolution"
      - "cash_flow_projection"
      - "risk_metrics"

    report_format: "html"
    include_appendix: true
    output_prefix: "retirement_analysis"
    timestamp_output: true

  # Performance Optimization
  performance:
    parallel_processing: true
    num_processes: 4
    memory_limit: "4GB"
    cache_results: true

# Economy Configuration
economy:
  inflation:
    expected_rate: 0.025
    volatility: 0.01

  # Risk-Free Rate
  risk_free_rate:
    rate: 0.025
    start_date: "2024-01-01"
    end_date: "2050-12-31"
    frequency: "monthly"
    source: "Treasury"

  # Market Regime Assumptions
  market_regimes:
    normal:
      probability: 0.70
      stock_return: 0.07
      bond_return: 0.045
      stock_vol: 0.12
      bond_vol: 0.05

    recession:
      probability: 0.20
      stock_return: -0.10
      bond_return: 0.08
      stock_vol: 0.20
      bond_vol: 0.08

    boom:
      probability: 0.10
      stock_return: 0.20
      bond_return: 0.01
      stock_vol: 0.15
      bond_vol: 0.06