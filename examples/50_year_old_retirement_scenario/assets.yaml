        insurance_cost_rate: 0.0

    - name: "Private Business Investment"
      asset_type: "custom"
      current_value: 100000.0
      expected_return: 0.12
      volatility: 0.30
      correlation: {}
      description: "Private business investment"
      metadata:
        custom_type: "Business"
        income_stream: 0.06
        growth_rate: 0.02
        liquidity_score: 0.2
        complexity_score: 0.8

